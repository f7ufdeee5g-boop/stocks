<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TradingView Widgets</title>
<style>
  /* Container che contiene tutti i widget */
  .widgets-wrapper {
    display: flex;
    flex-wrap: wrap;      /* i widget vanno a capo se lo spazio non basta */
    gap: 20px;            /* spazio tra i widget */
    justify-content: flex-start; /* allinea a sinistra */
  }

  /* Ogni widget mantiene dimensione fissa ma può ridursi su schermi piccoli */
  .tradingview-widget-container {
    flex: 1 1 250px; /* larghezza minima 250px, cresce fino a riempire lo spazio */
    max-width: 250px;
  }

  body {
    background-color: #1e1e1e; /* sfondo scuro */
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
</style>
</head>
<body>

  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/symbols/NASDAQ-ENPH/" target="_blank">
      </a>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
    {
      "symbol": "NASDAQ:ENPH",
      "colorTheme": "dark",
      "isTransparent": false,
      "locale": "en",
      "width": 250
    }
    </script>
